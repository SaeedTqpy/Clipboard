name: Clipboard
options:
  bundleIdPrefix: dev.clipboard
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Clipboard:
    type: application
    platform: macOS
    sources:
      - path: Clipboard
    preBuildScripts:
      - name: Generate macOS icon
        script: |
          set -euo pipefail
          /usr/bin/swift "$SRCROOT/scripts/render-app-icon.swift" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Clipboard.icns"
        shell: /bin/bash
        inputFiles:
          - $(SRCROOT)/scripts/render-app-icon.swift
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Clipboard.icns
        basedOnDependencyAnalysis: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipboard.app
        INFOPLIST_KEY_CFBundleIconFile: Clipboard.icns
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: Clipboard
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipboardTests
    dependencies:
      - target: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipboard.app.tests
schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
    test:
      targets:
        - ClipboardTests
