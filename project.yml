name: Clipboard
options:
  bundleIdPrefix: dev.clipboard
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Clipboard:
    type: application
    platform: macOS
    sources:
      - path: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipboard.app
        INFOPLIST_KEY_CFBundleDisplayName: Clipboard
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipboardTests
    dependencies:
      - target: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipboard.app.tests
schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
    test:
      targets:
        - ClipboardTests
