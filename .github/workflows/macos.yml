name: Clipboard macOS

# One-time validation requested for Dock overlay fix; restore manual-only after dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: clipboard-manual-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Run tests
        run: |
          xcodebuild test \
            -project Clipboard.xcodeproj \
            -scheme Clipboard \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.derived" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal unsigned release
        run: |
          xcodebuild build \
            -project Clipboard.xcodeproj \
            -scheme Clipboard \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$PWD/.derived" \
            'ARCHS=arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          lipo -info .derived/Build/Products/Release/Clipboard.app/Contents/MacOS/Clipboard

      - name: Verify bundled app icon
        run: |
          APP=".derived/Build/Products/Release/Clipboard.app"
          ICON="$APP/Contents/Resources/Clipboard.icns"
          test -s "$ICON"
          test "$( /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist" )" = "Clipboard.icns"
          iconutil --convert iconset "$ICON" --output "$RUNNER_TEMP/ClipboardVerified.iconset"
          test -s "$RUNNER_TEMP/ClipboardVerified.iconset/icon_512x512@2x.png"

      # TCC uses code identity. An entirely unsigned app has no designated
      # requirement, so Accessibility can be denied despite the UI toggle.
      # Ad-hoc signing gives THIS precise binary an identity; it is not a
      # replacement for a stable Developer ID and changes every build.
      - name: Ad-hoc sign local preview (TCC identity)
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Clipboard.app"
          /usr/bin/codesign --force --sign - --identifier dev.clipboard.app "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$APP"
          /usr/bin/codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/clipboard-signature.txt"
          grep -q '^Signature=adhoc' "$RUNNER_TEMP/clipboard-signature.txt"
          grep -q '^Identifier=dev.clipboard.app' "$RUNNER_TEMP/clipboard-signature.txt"
          /usr/bin/codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/clipboard-requirement.txt"
          grep -q 'designated =>' "$RUNNER_TEMP/clipboard-requirement.txt"
          test "$( /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" )" = "dev.clipboard.app"

      - name: Package signed local preview and checksum
        run: |
          set -euo pipefail
          APP=".derived/Build/Products/Release/Clipboard.app"
          /usr/bin/codesign --verify --strict "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            dist/Clipboard-macOS-adhoc.zip
          cd dist
          shasum -a 256 Clipboard-macOS-adhoc.zip > SHA256SUMS.txt

      - name: Upload ad-hoc signed local preview
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-macOS-adhoc
          path: dist/
          retention-days: 14
