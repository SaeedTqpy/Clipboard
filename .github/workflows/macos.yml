name: Clipboard macOS

# Intentionally manual: conserve GitHub Actions minutes.
# Use Actions > Clipboard macOS > Run workflow when validation is required.
on:
  workflow_dispatch:
  # One-shot validation; only an explicitly written marker can trigger this.
  push:
    branches: [main]
    paths:
      - ".ci/one-shot-validate-clipboard.txt"

concurrency:
  group: clipboard-manual-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Run tests
        run: |
          xcodebuild test \
            -project Clipboard.xcodeproj \
            -scheme Clipboard \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.derived" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal unsigned release
        run: |
          xcodebuild build \
            -project Clipboard.xcodeproj \
            -scheme Clipboard \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$PWD/.derived" \
            'ARCHS=arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          lipo -info .derived/Build/Products/Release/Clipboard.app/Contents/MacOS/Clipboard

      - name: Package and checksum
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .derived/Build/Products/Release/Clipboard.app \
            dist/Clipboard-macOS-unsigned.zip
          cd dist
          shasum -a 256 Clipboard-macOS-unsigned.zip > SHA256SUMS.txt

      - name: Upload unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-macOS-unsigned
          path: dist/
          retention-days: 14
